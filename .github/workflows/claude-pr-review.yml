name: PR Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
jobs:
  review:
    # SSP-02: Disabled until a hash-verified fixed executable is supplied via
    # path_to_claude_code_executable; the default bootstrap runs a remote installer.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read          # scope of the explicitly supplied workflow token
      pull-requests: write     # leave review comments
    steps:
      # Secret guard: skip green when the auth secret is absent so repos
      # without it configured don't get red-X failures on every PR.
      # (The `secrets` context isn't allowed in job-level `if`, so the check
      # lives in a step and gates the rest via its output.)
      - name: Check for review token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN secret not set — skipping Claude PR review."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.available == 'true'
        with: { fetch-depth: 1 }
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        if: steps.token.outputs.available == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this PR. High-signal only, skip nitpicks. Priority order:
            1. Correctness bugs and unhandled edge cases
            2. Security (input validation, secrets, injection)
            3. Broken links or malformed HTML/JSON in the published privacy notice
            4. Accuracy of the privacy-notice content vs. the app's actual behavior
            Inline comments for specific lines, one top-level verdict comment.
            Do NOT approve or merge.
          claude_args: |
            --permission-mode default
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
            --disallowedTools "Edit,Write,NotebookEdit,Bash(git:*),Bash(rm:*),Bash(gh api:*),Bash(gh pr checkout:*),Bash(gh pr edit:*),Bash(gh pr merge:*)"
